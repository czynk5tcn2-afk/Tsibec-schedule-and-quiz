<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f7f4fc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#100a1b" media="(prefers-color-scheme: dark)">
  <meta name="description" content="本学期课程与考试安排">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="课程表">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-v3.svg" type="image/svg+xml">

  <title>课程表</title>
  <script src="/pwa-v4.js?v=xk17-20261008" defer></script>
  <style>
:root{color-scheme: light;
      --bg: #f4f6fa;
      --surface: #ffffff;
      --surface-soft: #f8fbff;
      --text: #243147;
      --muted: #78879a;
      --line: #dce6f1;
      --primary: #5b87ba;
      --primary-strong: #3e6faa;
      --primary-soft: #e4f0fd;
      --today: #eef6ff;
      --shadow-sm: 0 5px 16px rgba(60,88,122,.08);
      --shadow-md: 0 16px 40px rgba(46,70,100,.14);
      --energy-blue: #79bfff;
      --energy-cyan: #6ed8dd;
      --energy-violet: #a98cff;}
*{box-sizing: border-box;}
html{-webkit-tap-highlight-color: transparent;}
body{margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overscroll-behavior-x: none;}
body::before{content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at 13% 9%, rgba(110,216,221,.17), transparent 29%),
        radial-gradient(circle at 88% 18%, rgba(169,140,255,.14), transparent 31%),
        radial-gradient(circle at 52% 88%, rgba(121,191,255,.16), transparent 35%);
      transition: opacity .34s ease;}
body.showcase-active::before,body.showcase-entering::before{opacity: 1;}
button{font: inherit; -webkit-appearance: none; appearance: none;}
button:focus-visible{outline: 3px solid rgba(91,135,186,.28); outline-offset: 2px;}
.app{position: relative; z-index: 1; width: min(1180px, 100%); margin: 0 auto; padding: 18px;}
.topbar{display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 13px;}
.title-wrap{min-width: 0;}
.title-line{display: flex; align-items: center; gap: 7px;}
h1{margin: 0; font-size: clamp(23px, 3vw, 34px); letter-spacing: -.045em; line-height: 1.08;}
.title-trigger{display: inline-block;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
      line-height: inherit;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      transition: transform .1s ease;}
.title-trigger::before,.title-trigger::after{content: attr(data-title);
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;}
.title-trigger{position: relative;}
body.showcase-entering .title-trigger::before{color: var(--energy-cyan);
      opacity: .48;
      animation: titleChromaticA .42s ease-out both;}
body.showcase-entering .title-trigger::after{color: var(--energy-violet);
      opacity: .38;
      animation: titleChromaticB .42s ease-out both;}
@keyframes titleChromaticA{ 0%,100% { transform: translate(0); opacity: 0; } 35% { transform: translate(-2px,1px); opacity: .55; } }
@keyframes titleChromaticB{ 0%,100% { transform: translate(0); opacity: 0; } 42% { transform: translate(2px,-1px); opacity: .45; } }
.mode-badge{min-height: 27px;
      border: 1px solid rgba(91,135,186,.28);
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(255,255,255,.82);
      color: var(--primary-strong);
      box-shadow: 0 4px 12px rgba(61,101,148,.10);
      font-size: 11px;
      font-weight: 740;
      cursor: pointer;
      white-space: nowrap;
      animation: modeBadgeIn .34s cubic-bezier(.22,1,.36,1) both;}
.mode-badge[hidden]{display: none;}
@keyframes modeBadgeIn{ from { opacity: 0; transform: translateX(-5px) scale(.9); } to { opacity: 1; transform: none; } }
.title-trigger.title-tap{transform: scale(.96);}
.title-trigger.title-unlocked{animation: titleUnlock .52s cubic-bezier(.2,.9,.25,1.2) both;}
@keyframes titleUnlock{
      0%,100% { transform: translateY(0) rotate(0); }
      35% { transform: translateY(-4px) rotate(-2deg); }
      68% { transform: translateY(1px) rotate(1deg); }
    }
.status{margin-top: 6px; color: var(--muted); font-size: 13px;}
.top-actions{display: flex; align-items: center; gap: 7px;}
.module-stage{position: relative; isolation: isolate;}
.module{position: relative; z-index: 1;}
.module.module-behind{position: absolute; inset: 0 0 auto; width: 100%; z-index: 0; pointer-events: none;}
.controls{display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 11px;}
.control-group{display: inline-flex;
      align-items: center;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);}
.control{min-width: 38px;
      min-height: 36px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      padding: 7px 10px;
      cursor: pointer;
      transition: transform .15s ease, background-color .18s ease, color .18s ease, opacity .18s ease;}
.control:active{transform: scale(.95);}
.control:hover{background: var(--primary-soft);}
.control:disabled{opacity: .3; cursor: default; transform: none;}
.control.primary{color: #fff; background: var(--primary); box-shadow: 0 5px 14px rgba(64,111,163,.20);}
.control.primary.is-current{color: var(--primary-strong); background: var(--primary-soft); box-shadow: none;}
.control.secondary{color: var(--primary-strong); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm);}
.top-actions .control{min-width: auto; white-space: nowrap;}
#weekButton,.week-button{min-width: 80px; text-align: center; font-weight: 720;}
.zoom-label{min-width: 52px; text-align: center; cursor: default; color: var(--muted); font-size: 13px;}
.zoom-label:hover{background: transparent;}
.weekline{display: flex;
      justify-content: center;
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      margin: 0 3px 8px;
      overflow: hidden;}
.weekline.is-changing span{animation: weekText .22s ease both;}
@keyframes weekText{ from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.schedule-shell{position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow-md);
      touch-action: pan-y pinch-zoom;}
.schedule-shell.is-overflowing{touch-action: auto;}
.schedule-track{display: flex;
      width: 300%;
      transform: translate3d(-33.333333%,0,0);}
.schedule-track.is-moving{will-change: transform;}
.schedule-track.is-animating{transition: transform .28s cubic-bezier(.22,.82,.32,1);}
.schedule-page{flex: 0 0 33.333333%; min-width: 0; transform-origin: center;}
.schedule-track.is-moving .schedule-page,body.showcase-active .schedule-page,body.showcase-entering .schedule-page{backface-visibility: hidden;}
body.showcase-active .schedule-shell{perspective: 900px; border-color: rgba(109,164,218,.62); box-shadow: 0 18px 42px rgba(53,91,132,.16), 0 0 0 1px rgba(169,140,255,.10);}
body.showcase-active .schedule-page{transition: transform .3s cubic-bezier(.22,.82,.32,1), opacity .3s ease;}
body.showcase-active .schedule-shell.moving-next .schedule-page:nth-child(2){transform: scale(.988) rotateY(-2.6deg); opacity: .9;}
body.showcase-active .schedule-shell.moving-prev .schedule-page:nth-child(2){transform: scale(.988) rotateY(2.6deg); opacity: .9;}
.schedule-page.week-jump-out{animation: weekJumpOut .16s ease-in both;}
.schedule-page.week-jump-in{animation: weekJumpIn .24s cubic-bezier(.22,1,.36,1) both;}
@keyframes weekJumpOut{ to { opacity: .18; transform: translateY(4px) scale(.975); } }
@keyframes weekJumpIn{ from { opacity: .18; transform: translateY(-5px) scale(.975); } to { opacity: 1; transform: none; } }
.schedule-scroll{width: 100%; overflow: auto; scrollbar-width: thin;}
.schedule{position: relative;
      display: grid;
      grid-template-columns: 52px repeat(5, minmax(0, 1fr));
      grid-template-rows: 52px repeat(4, minmax(92px, 1fr));
      min-width: 560px;
      transform-origin: top left;
      contain: layout paint style;}
.cell{position: relative;
      z-index: 1;
      min-width: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);}
.day-head{display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 740; font-size: 14px;}
.day-head small{color: var(--muted); font-size: 11px; font-weight: 530;}
.day-head.today span{color: var(--primary-strong); background: #dcecff; border-radius: 999px; padding: 3px 9px;}
.period{display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; line-height: 1.2; text-align: center;}
.today-column{z-index: 0; background: var(--today); pointer-events: none; overflow: hidden;}
.today-column.scan::after{content: "";
      position: absolute;
      inset: -35% 0 auto;
      height: 30%;
      background: linear-gradient(180deg, transparent, rgba(144,190,235,.28), transparent);
      animation: scanToday .65s ease-out both;}
@keyframes scanToday{ from { transform: translateY(-20%); opacity: 0; } 25% { opacity: 1; } to { transform: translateY(480%); opacity: 0; } }
.course{z-index: 2;
      margin: 4px;
      min-width: 0;
      border: 0;
      border-radius: 12px;
      padding: 0;
      color: var(--card-ink);
      background: transparent;
      cursor: pointer;
      overflow: visible;
      text-align: left;
      position: relative;}
.course-visual{position: relative;
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      border: 1px solid var(--card-border);
      border-radius: inherit;
      padding: 9px 8px;
      color: var(--card-ink);
      background: var(--card-bg);
      box-shadow: 0 4px 10px rgba(65,88,116,.075);
      transition: transform .16s ease, box-shadow .16s ease;
      transform-origin: center;}
.course:active .course-visual{transform: scale(.97); box-shadow: 0 2px 6px rgba(65,88,116,.08);}
.course.course-opening .course-visual{animation: coursePress .17s cubic-bezier(.2,.82,.28,1) both;}
.course.title-wave .course-visual{animation: titleWave .52s cubic-bezier(.2,.85,.28,1.2) both; animation-delay: calc(var(--wave-index, 0) * 52ms);}
body.showcase-active .course-visual::after{content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.58), inset 0 0 12px rgba(121,191,255,.10);
      opacity: .75;}
@keyframes coursePress{ 0%,100% { transform: scale(1); } 48% { transform: scale(.955); } }
@keyframes titleWave{
      0%,100% { transform: translateY(0) rotate(0); }
      38% { transform: translateY(-7px) rotate(-1deg); }
      70% { transform: translateY(2px) rotate(.5deg); }
    }
.course-name{display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-weight: 780;
      font-size: 14px;
      line-height: 1.25;}
.course-place{display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 6px;
      color: var(--card-ink);
      font-size: 11px;
      line-height: 1.25;
      font-weight: 500;}
.course.today-course.located .course-visual{animation: todayBounce .46s cubic-bezier(.2,.9,.25,1.2) both;}
@keyframes todayBounce{ 0%,100% { transform: translateY(0); } 48% { transform: translateY(-4px); } }
.empty{grid-column: 2 / 7; grid-row: 2 / 6; z-index: 3; display: none; place-items: center; width: 100%; border: 0; background: transparent; padding: 24px; color: var(--muted); text-align: center; pointer-events: none;}
.empty.current-empty{display: grid;}
body.showcase-active .schedule-page:nth-child(2) .empty.current-empty{pointer-events: auto; cursor: pointer;}
.empty-message{animation: floatOnce .65s cubic-bezier(.22,.82,.32,1) both; font-weight: 680;}
@keyframes floatOnce{ from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
.dialog{position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(32,45,64,.25);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .18s ease, visibility .18s ease;}
.dialog.open{opacity: 1; visibility: visible; pointer-events: auto;}
.dialog-card{position: relative;
      width: min(360px, 86vw);
      max-height: min(680px, 84vh);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 21px;
      background: var(--surface);
      box-shadow: 0 22px 58px rgba(38,58,84,.22);
      padding: 24px 21px 20px;
      transform: translateY(7px) scale(.96);
      transition: transform .2s cubic-bezier(.2,.82,.28,1);}
.dialog.open .dialog-card{transform: translateY(0) scale(1);}
.dialog-accent{position: absolute; inset: 0 0 auto; height: 7px; background: var(--dialog-accent, var(--primary));}
.dialog-card h2{margin: 0 0 17px; font-size: 23px; line-height: 1.22; letter-spacing: -.025em;}
.dialog-body{color: var(--text);}
.dialog-close{width: 100%; margin-top: 21px;}
.week-grid{display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;}
.week-option{min-height: 40px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-soft); color: var(--text); font-weight: 660; cursor: pointer;}
.week-option span,.week-option small{display: block;}
.week-option small{margin-top: 2px; color: var(--muted); font-size: 9px; font-weight: 560;}
.week-option.current{color: var(--primary-strong); background: var(--primary-soft);}
.week-option.selected{border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary);}
.week-option.targeting{animation: weekTarget .24s cubic-bezier(.22,1,.36,1) both;}
.dialog-card.week-pop::after{content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(121,191,255,.24);
      border-radius: 16px;
      pointer-events: none;
      animation: weekRadar .42s ease-out both;}
@keyframes weekTarget{ 45% { transform: scale(.92); box-shadow: 0 0 0 5px rgba(121,191,255,.16); } }
@keyframes weekRadar{ from { opacity: 0; transform: scale(.88); } to { opacity: 0; transform: scale(1.05); } }
.mode-launch{width: 100%;
      min-height: 42px;
      margin-top: 17px;
      border: 1px solid rgba(91,135,186,.30);
      border-radius: 12px;
      background: linear-gradient(120deg, rgba(228,240,253,.95), rgba(238,233,255,.88));
      color: var(--primary-strong);
      font-weight: 760;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .18s ease;}
.mode-launch:active{transform: scale(.97);}
.mode-launch:hover{box-shadow: 0 6px 18px rgba(83,128,178,.14);}
.pwa-install{width: 100%; min-height: 42px; margin-top: 10px; border: 1px solid var(--line);
      border-radius: 12px; padding: 9px 12px; background: var(--surface); color: var(--text);
      text-align: left; cursor: pointer; box-shadow: 0 4px 12px rgba(61,101,148,.07);}
.pwa-install strong,.pwa-install small{display: block;}
.pwa-install strong{font-size: 13px;}
.pwa-install small{margin-top: 3px; color: var(--muted); font-size: 11px;}
.pwa-install[hidden]{display: none;}
.install-guide{text-align: center;}
.install-guide-icon{display: grid; place-items: center; width: 58px; height: 58px; margin: 0 auto 14px; border-radius: 17px; background: linear-gradient(135deg,#34d9f4,#4f6eff 55%,#e243cf); color: #fff; box-shadow: 0 10px 26px rgba(75,102,226,.26); font-size: 26px;}
.install-guide p{margin: 0; color: var(--muted); font-size: 14px; line-height: 1.75;}
.pwa-update-toast{position: fixed; z-index: 90; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
      display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100vw - 28px);
      border: 1px solid rgba(255,255,255,.78); border-radius: 999px; padding: 8px 9px 8px 14px;
      background: rgba(35,49,70,.94); color: #fff; box-shadow: 0 14px 38px rgba(25,39,58,.25);
      font-size: 13px; transform: translate(-50%,24px); opacity: 0; transition: .28s ease;}
.pwa-update-toast.visible{transform: translate(-50%,0); opacity: 1;}
.pwa-update-toast button{border: 0; border-radius: 999px; padding: 7px 11px; background: #fff; color: #315f96; font-weight: 750; cursor: pointer;}
.dialog-card.easter-pop{animation: easterCard .72s cubic-bezier(.18,.9,.26,1.18) both;}
.dialog-card.easter-pop .dialog-accent{animation: accentPulse .72s ease-out both;}
.dialog-card.course-pop{animation: courseDialog .26s cubic-bezier(.2,.82,.28,1) both;}
.dialog-card.course-pop .dialog-accent{transform-origin: center; animation: courseAccent .3s ease-out both;}
@keyframes easterCard{
      0% { opacity: 0; transform: translateY(16px) scale(.76) rotate(-3deg); }
      58% { opacity: 1; transform: translateY(-3px) scale(1.045) rotate(1deg); }
      78% { transform: translateY(1px) scale(.985) rotate(-.4deg); }
      100% { transform: translateY(0) scale(1) rotate(0); }
    }
@keyframes courseDialog{
      from { opacity: 0; transform: translateY(8px) scale(.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
@keyframes courseAccent{ from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes accentPulse{ 0% { transform: scaleX(0); } 60% { transform: scaleX(1.08); } 100% { transform: scaleX(1); } }
.module-switch-wrap{display: flex; justify-content: center; margin: 16px 0 3px;}
.module-switch{display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 180px;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      color: var(--primary-strong);
      box-shadow: var(--shadow-sm);
      font-weight: 720;
      cursor: pointer;
      transition: transform .15s ease, background-color .18s ease;}
.module-switch:hover{background: var(--primary-soft);}
.module-switch:active{transform: scale(.96);}
.module-switch span{transition: transform .18s ease;}
.module-switch:hover span{transform: translateX(3px);}
.exam-card{position: relative;
      min-height: 460px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 34px 22px;
      background: var(--surface);
      box-shadow: var(--shadow-md);
      text-align: center;}
.exam-placeholder{max-width: 430px;}
.exam-orb{display: inline-block; border: 0; padding: 0; background: transparent; font: inherit; font-size: 62px; line-height: 1; cursor: default; animation: oracleArrive .65s cubic-bezier(.2,.88,.28,1.15) both;}
button.exam-orb{cursor: pointer;}
.exam-placeholder h2{margin: 17px 0 10px; font-size: 23px;}
.exam-placeholder p{margin: 0; color: var(--muted); font-size: 15px; line-height: 1.7;}
.exam-mode-badge{position: absolute; top: 12px; right: 12px; z-index: 3;}
.exam-content{width: min(620px, 100%); margin: 0 auto; text-align: left;}
.exam-summary{margin-bottom: 20px; text-align: center;}
.exam-summary h2{margin: 0 0 8px; font-size: 24px;}
.exam-summary p{margin: 0; color: var(--muted); line-height: 1.55;}
.exam-list{position: relative; display: grid; gap: 12px;}
.exam-list::before{content: ""; position: absolute; left: 17px; top: 15px; bottom: 15px; width: 2px; background: var(--line);}
.exam-item{position: relative; display: grid; grid-template-columns: 48px 1fr; gap: 12px; border: 1px solid var(--exam-border, var(--line)); border-radius: 14px; padding: 13px 14px 13px 10px; background: var(--exam-bg, var(--surface-soft)); color: var(--exam-ink, var(--text)); font: inherit; text-align: left; overflow: hidden; cursor: default;}
button.exam-item{cursor: pointer;}
.exam-date{position: relative; z-index: 1; display: grid; place-items: center; align-self: start; min-height: 42px; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow-sm); font-variant-numeric: tabular-nums;}
.exam-date strong{display: block; font-size: 17px; line-height: 1;}
.exam-date small{display: block; margin-top: 3px; color: var(--muted); font-size: 9px;}
.exam-info strong{display: block; margin-bottom: 5px; font-size: 16px;}
.exam-info span{display: block; color: var(--muted); font-size: 13px; line-height: 1.55;}
.exam-note{margin-top: 5px;}
body.showcase-active .exam-card{border-color: rgba(109,164,218,.55); box-shadow: 0 18px 42px rgba(53,91,132,.15), 0 0 0 1px rgba(169,140,255,.09);}
body.showcase-active .exam-item{animation: examNodeIn .34s cubic-bezier(.22,1,.36,1) both; animation-delay: var(--exam-delay, 0ms);}
body.showcase-active .exam-list::before{transform-origin: top; animation: examLineDraw .48s ease-out both;}
.exam-placeholder.scanning::before{content: "";
      position: absolute;
      left: 10%; right: 10%; top: 48%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(121,191,255,.75), transparent);
      animation: examScan .62s ease-out both;}
.exam-placeholder.scanning{position: relative;}
.exam-orb.orb-tap{animation: orbTap .42s cubic-bezier(.22,1,.36,1) both;}
.exam-item.exam-node-active{animation: examNodePulse .52s cubic-bezier(.22,1,.36,1) both !important;}
@keyframes examNodeIn{ from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes examLineDraw{ from { transform: scaleY(0); } to { transform: scaleY(1); } }

.calibration-overlay{position: absolute; inset: 0; z-index: 8; pointer-events: none; border: 1px solid rgba(121,191,255,.38); border-radius: inherit; animation: calibrationFade .3s ease-out both;}

.calibration-overlay::before{left: 8%; right: 8%; top: 50%; height: 1px;}
.calibration-overlay::after{top: 8%; bottom: 8%; left: 50%; width: 1px; background: linear-gradient(180deg, transparent, rgba(169,140,255,.52), transparent);}
@keyframes calibrationFade{ from { opacity: 0; transform: scale(.985); } 45% { opacity: 1; } to { opacity: 0; transform: scale(1); } }

.app{width:min(780px,100%);padding:32px 24px max(28px,env(safe-area-inset-bottom));isolation:isolate}

.controls{display:flex;justify-content:flex-start;align-items:center;gap:10px;margin-bottom:14px}

.week-button{min-width:92px;font-size:15px;font-weight:750;font-variant-numeric:tabular-nums}

.day-head small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

.period{font-size:11px;font-weight:600;color:var(--faint);line-height:1.7;font-variant-numeric:tabular-nums}
.today-column{background:var(--today)}
.course{margin:5px 3px;border-radius:11px}

.course:active .course-visual{box-shadow:inset 0 1px #ffffffa6}

.dialog-card{width:min(560px,100%);max-height:88vh;max-height:88dvh;border:1px solid var(--line);border-bottom:0;border-radius:27px 27px 0 0;padding:0 24px max(24px,env(safe-area-inset-bottom));background:var(--surface);color:var(--text);box-shadow:0 -16px 70px #1020301f;transform:translateY(42px);transition:transform .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain;scrollbar-width:thin}

.pref-actions{display:flex;gap:7px}
.pref-actions button{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px 8px;min-height:44px;background:var(--surface-soft);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.pref-actions button[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-strong)}

/* ════════════ 小克版 r3 · 普通模式美化 ════════════ */
/* 周次导航独占一行（日览已删除） */
.controls .control-group[aria-label="周次切换"]{flex:1;justify-content:space-between}

.control.at-edge{opacity:.38}
#today.is-current{opacity:.55}
body.no-swipe-hint .weekline::after{content:none}

.semester-label:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:4px}
.today-column.nudge{animation:todayNudge .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes todayNudge{35%{transform:translateY(-5px)}70%{transform:translateY(1px)}}

/* 课程卡：四个字的课名只在正中间断行 */
.course-name{word-break:keep-all;overflow-wrap:normal}

/* 弹窗：遮罩毛玻璃，面板带回弹（下方用实色阴影补上回弹时露出的缝） */
.dialog{-webkit-backdrop-filter:blur(6px) saturate(1.15);backdrop-filter:blur(6px) saturate(1.15)}

.dialog-card{transition:transform .52s cubic-bezier(.22,1.28,.36,1);box-shadow:0 -16px 70px #1020301f,0 80px 0 0 var(--surface)}
.dialog-card:is([data-kind="course"],[data-kind="settings"],[data-kind="week"],[data-kind="install"],[data-kind="semester"]) .dialog-close{background:var(--surface-sunk);color:var(--text-soft);border:1px solid var(--line);box-shadow:none;font-weight:600}

/* 课程详情 */
:where(.dialog-card[data-kind="course"]){--card-bg:var(--surface-soft);--card-ink:var(--primary-strong);--card-border:var(--line)}
.dialog-card[data-kind="course"],html.dark-field body.optical-on .dialog-card[data-kind="course"]{background:linear-gradient(180deg,var(--card-bg) 0,var(--surface) 230px)}
@supports (background:color-mix(in srgb,red 50%,transparent)){
  .dialog-card[data-kind="course"],html.dark-field body.optical-on .dialog-card[data-kind="course"]{background:linear-gradient(180deg,color-mix(in srgb,var(--card-bg) 94%,var(--surface)) 0,var(--surface) 230px)}
}
.dialog-card[data-kind="course"] .dialog-accent{display:none}
.dialog-card[data-kind="course"] h2{color:var(--card-ink);font-size:28px;margin:6px 0 16px}
.cd{display:grid;gap:12px}
.cd-hero{padding:15px 16px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--card-border);box-shadow:0 10px 24px -18px var(--card-ink)}
.cd-when{font-size:23px;font-weight:720;letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums}
.cd-sub{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.cd-rel{padding:3px 10px;border-radius:999px;background:var(--card-ink);color:var(--surface);font-weight:650;font-size:12px}
.cd-rel.past{background:var(--surface-sunk);color:var(--muted)}
.cd-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cd-label{font-size:12.5px;color:var(--muted);flex:none}
.cd-place{padding:4px 2px}
.cd-where{text-align:right}
.cd-bld{font-size:13.5px;color:var(--text-soft);margin-right:7px}
.cd-room{font-size:21px;font-weight:720;color:var(--card-ink);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.cd-weeks{padding:12px 2px 2px;border-top:1px solid var(--line-soft)}
.cd-weektext{font-size:13.5px;color:var(--text);text-align:right}
.cd-strip{display:grid;grid-template-columns:repeat(var(--n,20),1fr);gap:3px;margin-top:10px}
.cd-strip i{height:14px;border-radius:4px;background:var(--surface-sunk)}
.cd-strip i.on{background:var(--card-ink)}
.cd-strip i.on.past{opacity:.32}
.cd-strip i.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--text)}
.cd-axis{display:flex;justify-content:space-between;margin-top:5px;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.cd-stat{appearance:none;border:0;background:none;padding:6px 0 0;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer;text-align:left}
.cd-stat.quip{color:var(--card-ink);font-weight:600}
.cd-others{padding-top:12px;border-top:1px solid var(--line-soft)}
.cd-others ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.cd-others li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:9px 12px;border-radius:12px;background:var(--surface-soft)}
.cd-others li strong{font-weight:620;color:var(--text)}
.cd-others li span{color:var(--muted);text-align:right}

/* “点我”心情卡 */
.mood{display:grid;justify-items:center;text-align:center;gap:14px;padding:2px 0 4px}
.mood-hero{appearance:none;border:0;cursor:pointer;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--surface-soft);box-shadow:0 14px 30px -14px var(--tone);animation:moodFloat 3.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
@supports (background:color-mix(in srgb,red 50%,transparent)){.mood-hero{background:radial-gradient(circle at 34% 28%,#ffffffb0,transparent 58%),color-mix(in srgb,var(--tone) 24%,var(--surface))}}
.mood-emoji{font-size:50px;line-height:1}
.mood-hero.boing{animation:moodBoing .55s cubic-bezier(.3,1.6,.4,1)}
@keyframes moodFloat{50%{transform:translateY(-4px)}}
@keyframes moodBoing{0%{transform:scale(.78) rotate(-10deg)}60%{transform:scale(1.12) rotate(5deg)}100%{transform:none}}
.mood-line{margin:0;font-size:15.5px;line-height:1.7;color:var(--text-soft);max-width:22em;min-height:3.4em}
.mood-today{width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--surface-soft)}
.mood-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px;margin-bottom:9px;font-size:13px;color:var(--muted)}

.mood-today li{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--card-bg,var(--surface));color:var(--card-ink,var(--text))}
.mood-today li b{font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;opacity:.8}
.mood-today li strong{font-size:15px;font-weight:650}
.mood-today li span{font-size:12px;opacity:.85}
.mood .next-course-note,.mood .mode-launch{width:100%;margin:0!important}

/* 学期进度 */
.sem{display:grid;gap:12px;--card-ink:var(--primary)}
.sem-big{display:flex;align-items:baseline;gap:10px}
.sem-big strong{font-size:48px;font-weight:760;letter-spacing:-.04em;color:var(--primary-strong);font-variant-numeric:tabular-nums}
.sem-big span{font-size:13px;color:var(--muted)}
.sem-facts{margin:2px 0 0;font-size:14px;color:var(--text-soft);line-height:1.7}
.sem-quip{margin:0;font-size:14px;color:var(--muted)}

/* 周次选择：已经过去的周变淡 */
.week-option.past{opacity:.5}

/* 轻提示 */
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:70;max-width:min(88vw,420px);padding:11px 16px;border-radius:14px;background:var(--text);color:var(--surface);font-size:13.5px;line-height:1.5;text-align:center;box-shadow:0 12px 30px -12px #0007;pointer-events:none;opacity:0;transform:translate(-50%,18px);transition:opacity .25s ease,transform .4s cubic-bezier(.2,1.3,.4,1)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.mood-hero,.mood-hero.boing,.today-column.nudge{animation:none}.dialog-card{transition:none}.toast{transition:opacity .2s}}

/* ════════════ 小克版 r5 · 细节打磨 ════════════ */
/* 可读性：节次、日期、教室号原来是 10px 浅灰，对比度不到 4.5:1 */
.period{color:var(--muted)}
.semester-label{color:var(--muted);padding-block:6px;margin-block:-6px 2px}
.course-place{opacity:.92}
@media (max-width:480px){.period{font-size:11px}.day-head small{font-size:10.5px}.course-place{font-size:10.5px}}
/* 本周：今天的课描边，已过去日子的课变淡 */
.course.is-past .course-visual{opacity:.58;filter:saturate(.7)}
.course.is-today .course-visual{box-shadow:inset 0 0 0 2px var(--card-ink),inset 0 1px #ffffffa6}
html.dark-field body.optical-on .course.is-today .course-visual{box-shadow:inset 0 0 0 2px var(--card-ink),0 0 18px -6px var(--card-ink)}
/* 触控：去掉双击缩放的等待，长按不弹出选字菜单 */
button,[role="button"],.course{touch-action:manipulation}
.course,.control,.module-switch,.mode-badge,.title,h1,.semester-label,.week-option{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.pref-version{margin:14px 0 0;text-align:center;font-size:11.5px;color:var(--faint);letter-spacing:.04em}
/* ════════════ 小克版 r9 · 作息时间 ════════════ */
/* 左栏：节次 + 上下课时间 */
.period{flex-direction:column;gap:1px;line-height:1.3}
.period b{font-weight:700;margin-bottom:4px}
.period small{font-size:10px;font-weight:550;letter-spacing:-.03em;color:var(--muted)}
@media (max-width:780px){.schedule{grid-template-columns:33px repeat(5,minmax(0,1fr))}.schedule.has-weekend{grid-template-columns:33px repeat(7,minmax(0,1fr))}}
@media (max-width:359px){.schedule{grid-template-columns:30px repeat(5,minmax(0,1fr))}.schedule.has-weekend{grid-template-columns:30px repeat(7,minmax(0,1fr))}.period small{font-size:9.5px}}
/* 顶部提示条：上课中 / 下一节 / 下次有课（静态，每分钟换一次字） */
.now-strip{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;width:100%;min-height:46px;margin:-8px 0 12px;padding:10px 14px;border:0;border-radius:15px;background:var(--surface);box-shadow:var(--shadow-sm);color:var(--text);font:inherit;text-align:left;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.now-strip[hidden]{display:none}
.now-strip:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.now-tag{flex:none;padding:3px 9px;border-radius:999px;background:var(--surface-sunk);color:var(--text);font-size:12px;font-weight:700}
.now-strip[data-mode="live"] .now-tag{background:var(--primary);color:var(--on-primary)}
.now-main{flex:1 1 auto;min-width:0;font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}
.now-sub{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.now-sub:empty{display:none}
.now-strip[data-mode="live"]::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0) * 100%);background:var(--primary);opacity:.55}
html.dark-field body.optical-on .now-strip{background:rgba(26,17,41,.72)}
@media (max-width:359px){.now-strip{padding:9px 11px;gap:4px 8px}.now-main{font-size:13px}.now-sub{font-size:11.5px}}
/* 本周：正在上的课反色；今天已下课的课和以前的课一样变淡 */
.course.is-now .course-visual,html.dark-field body.optical-on .course.is-now .course-visual{background:var(--card-ink);box-shadow:0 4px 14px -6px var(--card-ink)}
.course.is-now .course-name,.course.is-now .course-place{color:var(--card-bg)}
.course.is-done .course-visual{opacity:.58;filter:saturate(.7)}
/* 课程详情：午休提示 */
.cd-lunch{margin-top:8px;font-size:12.5px;color:var(--muted)}
/* 心情卡：时间小字；今日课程里正在上的描边、已上完的变淡 */
.mood-hint{margin:0;padding:6px 12px;border-radius:999px;background:var(--surface-soft);color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.mood-today li.now{box-shadow:inset 0 0 0 2px var(--card-ink,var(--primary))}
.mood-today li.done{opacity:.55}
/* ════════════ 小克版 r10 · 考试倒数、日历订阅 ════════════ */
.exam-info .exam-countdown{display:inline-block;margin-top:7px;padding:2px 9px;border-radius:999px;background:var(--card-ink);color:var(--card-bg);font-size:12px;font-weight:700;opacity:1;font-variant-numeric:tabular-nums}
.exam-item.is-next{box-shadow:inset 0 0 0 2px var(--card-ink)}
.exam-item.is-over{opacity:.55;filter:saturate(.7)}
.exam-item.is-over .exam-countdown{background:transparent;color:var(--card-ink);padding-inline:0}
.cal-sheet{display:grid;gap:14px;font-size:14px;line-height:1.6;color:var(--text-soft,var(--text))}
.cal-sheet p{margin:0}
.cal-sheet h3{margin:4px 0 0;font-size:15px;color:var(--text)}
.cal-sheet ol{margin:0;padding-left:20px;display:grid;gap:4px}
.cal-sheet small{color:var(--muted);font-size:12.5px;line-height:1.55}
.cal-primary{display:flex;align-items:center;justify-content:center;min-height:46px;padding:10px 16px;border:0;border-radius:14px;background:var(--primary);color:var(--on-primary);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.cal-secondary{display:flex;align-items:center;justify-content:center;min-height:44px;padding:9px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);font:inherit;font-weight:650;text-decoration:none;cursor:pointer}
.cal-url{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-soft);color:var(--text);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
.pref-calendar{margin-top:10px}
/* ════════════ 小克版 r11 · 找回“点我”图标的进场动画（第四次优化版的 easterHero / freeHero） ════════════ */
.dialog-card.easter-pop .mood-hero{animation:easterHero .78s ease-out both,moodFloat 3.4s ease-in-out .78s infinite}
.dialog-card.free-pop .mood-hero{animation:freeHero .9s ease-out both,moodFloat 3.4s ease-in-out .9s infinite}
.dialog-card.easter-pop .mood-hero.boing{animation:moodBoing .55s cubic-bezier(.3,1.6,.4,1)}
@keyframes easterHero{0%{opacity:0;transform:translateY(10px) scale(.5) rotate(-16deg)}55%{opacity:1;transform:translateY(-7px) scale(1.16) rotate(8deg)}78%{transform:translateY(2px) scale(.96) rotate(-3deg)}100%{transform:none}}
@keyframes freeHero{0%{opacity:0;transform:translateY(12px) scale(.48) rotate(-12deg)}48%{opacity:1;transform:translateY(-9px) scale(1.2) rotate(9deg)}70%{transform:translateY(3px) scale(.94) rotate(-4deg)}86%{transform:translateY(-2px) scale(1.04) rotate(2deg)}100%{transform:none}}
/* 同样的弹出也用在普通模式另外两个图标上：考试页水晶球（等切页滑入后再弹）、没课那周的 🥳 */
.exam-placeholder div.exam-orb{display:inline-block;animation:easterHero .78s ease-out .24s both}
.empty-emoji{display:inline-block;animation:easterHero .78s ease-out .1s both}
@media (prefers-reduced-motion:reduce){.dialog-card.easter-pop .mood-hero,.dialog-card.free-pop .mood-hero,.dialog-card.easter-pop .mood-hero.boing,.exam-placeholder div.exam-orb,.empty-emoji{animation:none}}
</style>

      </div>

    function clampWeek(week) { return Math.min(SEMESTER.totalWeeks, Math.max(1, Number(week))); }
    function mondayOf(week) {

    function fmt(date) { return `${date.getMonth()+1}/${date.getDate()}`; }
    function fullDate(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`; }
    function humanDate(date, withYear = false) {
      return `${withYear ? `${date.getFullYear()}年` : ""}${date.getMonth()+1}月${date.getDate()}日`;
    }
    function weekdayText(date) { return ["周日","周一","周二","周三","周四","周五","周六"][date.getDay()]; }
    function active(spec, week) {
      return spec.split(",").some(raw => {
        const match = raw.trim().match(/^(\d+)(?:-(\d+))?(?:\((单|双)\))?$/);
        if (!match) return false;
        const start = Number(match[1]);
        const end = Number(match[2] || match[1]);
        const parity = match[3];
        return week >= start && week <= end && (!parity || (parity === "单" ? week % 2 === 1 : week % 2 === 0));
      });
    }
    const courseWeekCache = new Map();
    function coursesFor(week) {
      if (!courseWeekCache.has(week)) courseWeekCache.set(week, COURSES.filter(course => active(course[5], week)));

    // 课程卡上的地点简写：“教学楼A101”→“A101”，“实验楼C305”→“C305”；按自己学校的写法改这里

      return room ? room[1] : place;
    }
    function formatWeeks(spec) {
      return spec.split(",").map(raw => {
        const item = raw.trim();
        const parity = item.includes("(单)") ? "（单周）" : item.includes("(双)") ? "（双周）" : "";
        return `第${item.replace(/\((单|双)\)/, "")}周${parity}`;
      }).join("、");
    }
    function dateForCourse(week, course) {
      const date = mondayOf(week);

    }
    /* ── 作息时间（r9）──────────────────────────────────────
       时间都按“当天第几分钟”算；“现在”一律用 beijingNow()。 */
    function minutesOf(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }
    function clockText(hhmm) { return hhmm.replace(/^0/, ""); }
    function courseSpan(course) {
      const from = CLASS_TIMES[course[3]-1][0], to = CLASS_TIMES[course[4]-1][1];
      // 跨上午、下午的课（实验课）中间有午休
      const lunch = course[3] <= 4 && course[4] >= 5 ? { from: minutesOf(CLASS_TIMES[3][1]), to: minutesOf(CLASS_TIMES[4][0]), text: `${clockText(CLASS_TIMES[3][1])}–${clockText(CLASS_TIMES[4][0])}`, resume: clockText(CLASS_TIMES[4][0]) } : null;
      return { start: minutesOf(from), end: minutesOf(to), from: clockText(from), to: clockText(to), lunch };
    }
    function minuteOfDay(clock) { return clock.getHours() * 60 + clock.getMinutes(); }
    function durationText(minutes) {
      if (minutes < 60) return `${Math.max(1, minutes)} 分钟`;
      const h = Math.floor(minutes / 60), m = minutes % 60;
      if (h < 24) return m ? `${h} 小时 ${m} 分钟` : `${h} 小时`;
      const d = Math.floor(h / 24), rest = h % 24;
      return d >= 7 || !rest ? `${d} 天` : `${d} 天 ${rest} 小时`;
    }
    // 某一刻的上课状态：今天的课（带时间）、正在上的、下一节
    function classStateAt(clock) {
      const day = new Date(clock); day.setHours(0,0,0,0);
      const t = minuteOfDay(clock);
      const items = coursesAt(day).map(course => ({ course, ...courseSpan(course) }));
      const current = items.find(item => t >= item.start && t < item.end) || null;
      const next = items.find(item => item.start > t) || null;
      const inLunch = !!(current?.lunch && t >= current.lunch.from && t < current.lunch.to);
      return { day, t, items, current, next, inLunch, ended: items.length > 0 && t >= items[items.length-1].end };
    }

    function ensureShowcaseAssets() {
      if (window.ScheduleShowcaseEngine && document.getElementById("showcase-pro-style")?.sheet) return Promise.resolve(window.ScheduleShowcaseEngine);

    /* ── 课程详情 ───────────────────────────────────────────
       头部用课程色；时间是主角；周次画成一排格子；列出同一门课的其他时段。 */
    function todayStart() { const t = beijingNow(); t.setHours(0,0,0,0); return t; }
    function relativeDay(date) {
      const diff = Math.round((calendarDay(date) - calendarDay(todayStart())) / msDay);
      if (diff === 0) return "今天";
      if (diff === 1) return "明天";
      if (diff === 2) return "后天";
      if (diff === -1) return "昨天";
      return diff > 0 ? `${diff} 天后` : `${-diff} 天前`;
    }
    // 课程详情顶部的小标签：上课中 / 还有多久 / 已下课
    function courseCountdown(date, span) {
      const clock = beijingNow();
      const sameDay = calendarDay(date) === calendarDay(clock);
      const t = minuteOfDay(clock);
      if (sameDay && t >= span.start && t < span.end) {
        if (span.lunch && t >= span.lunch.from && t < span.lunch.to) return `午休中 · ${span.lunch.resume} 继续`;
        return `上课中 · 还有 ${durationText(span.end - t)}`;
      }
      if (sameDay && t >= span.end) return "已下课";
      const dayDiff = Math.round((calendarDay(date) - calendarDay(clock)) / msDay);
      if (dayDiff < 0) return relativeDay(date);
      return `还有 ${durationText(dayDiff * 1440 + span.start - t)}`;

    function nowCourseText(course) { return `${shortNames[course[0]] || course[0]} · ${shortPlace(course[1])}`; }

      const state = classStateAt(beijingNow());
      const tag = strip.querySelector(".now-tag"), main = strip.querySelector(".now-main"), sub = strip.querySelector(".now-sub");
      let mode = "next", progress = null;
      if (state.current) {
        const c = state.current;
        mode = "live";
        tag.textContent = state.inLunch ? "午休中" : "上课中";
        main.textContent = nowCourseText(c.course);
        sub.textContent = state.inLunch ? `${c.lunch.resume} 继续` : `还有 ${durationText(c.end - state.t)} 下课`;
        progress = (state.t - c.start) / (c.end - c.start);
        nowStripTarget = { course: c.course, date: state.day };
      } else if (state.next) {
        tag.textContent = "下一节";
        main.textContent = `${state.next.from} ${nowCourseText(state.next.course)}`;
        sub.textContent = `还有 ${durationText(state.next.start - state.t)}`;
        nowStripTarget = { course: state.next.course, date: state.day };
      } else {
        const next = nextCourseAfter(state.day);
        if (!next) { strip.hidden = true; return; }
        const diff = Math.round((calendarDay(next.date) - calendarDay(state.day)) / msDay);
        tag.textContent = "下次有课";
        main.textContent = `${diff <= 2 ? relativeDay(next.date) : `${humanDate(next.date)} ${weekdayText(next.date)}`} ${courseSpan(next.course).from} ${nowCourseText(next.course)}`;
        sub.textContent = state.items.length ? "今天的课上完了" : "";

      const focusable = Array.from(dialogCard.querySelectorAll("button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex='-1'])"))

      if (!focusable.length) {

      const first = focusable[0];

function beijingNow() {
  const c = new Date(Date.now() + 8 * 3600000);
  return new Date(c.getUTCFullYear(),c.getUTCMonth(),c.getUTCDate(),c.getUTCHours(),c.getUTCMinutes(),c.getUTCSeconds(),c.getUTCMilliseconds());
}
function calendarDay(date) { return Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()); }
function weekAt(date) { return Math.floor((calendarDay(date)-calendarDay(firstMonday))/(7*msDay))+1; }
function coursesAt(date) {
  const week = weekAt(date), day = date.getDay() || 7;
  return week < 1 || week > SEMESTER.totalWeeks ? [] : uniqueCourses(coursesFor(week).filter(c=>c[2]===day)).sort((a,b)=>a[3]-b[3]);
}
function nextCourseAfter(date) {
  const end = mondayOf(SEMESTER.totalWeeks+1);
  const cursor = new Date(date); cursor.setHours(0,0,0,0); cursor.setDate(cursor.getDate()+1);
  if(cursor < firstMonday) cursor.setTime(firstMonday.getTime());
  for(;cursor<end;cursor.setDate(cursor.getDate()+1)) {
    const list=coursesAt(cursor);
    if(list.length) return {date:new Date(cursor),course:list[0]};
  }
  return null;
}
function appendNextCourse(parent,date) {
  const next=nextCourseAfter(date), note=document.createElement('p'); note.className='next-course-note';
  if(next) {
    note.append(document.createTextNode(`下次有课 · ${humanDate(next.date)} ${weekdayText(next.date)}`));

    line.textContent=`第${next.course[3]}–${next.course[4]}节 · ${shortNames[next.course[0]]||next.course[0]} · ${shortPlace(next.course[1])}`;
    note.append(line);
  } else note.textContent='当前课表中没有更晚的课程。';
  parent.append(note);
}
